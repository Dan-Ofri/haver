# One command brings up the whole stack:  docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: haver
      POSTGRES_PASSWORD: haver
      POSTGRES_DB: haver
    ports:
      # Local only, so a backend run outside Docker can reach it.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haver"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://haver:haver@db:5432/haver
      # The public demo runs on a made-up trainee. Set to false to start with empty logs.
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
