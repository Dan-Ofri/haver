# One command brings up the whole stack:  docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: haver
      POSTGRES_PASSWORD: haver
      POSTGRES_DB: haver
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haver"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://haver:haver@db:5432/haver
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
