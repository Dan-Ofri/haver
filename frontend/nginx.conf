server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Answers will stream token by token, so buffering stays off.
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
